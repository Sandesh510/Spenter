[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Single-page app: every route serves index.html so deep links work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker file must always be fetched fresh, or an update would never reach the phone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build files never change, so they can be kept for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic protections for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
