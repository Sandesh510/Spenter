<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:312px;height:712px;background:var(--sc-bg);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;font-family:var(--font-body)">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 22px 5px;font-size:12px;color:var(--sc-text);font-feature-settings:'tnum'">
    <span style="font-weight:600">9:41</span>
    <span style="display:flex;gap:6px;align-items:center;color:var(--sc-muted)"><span style="font-size:13px"><i data-lucide="signal"></i></span><span style="font-size:13px"><i data-lucide="wifi"></i></span><span style="font-size:14px"><i data-lucide="battery-full"></i></span></span>
  </div>

  <!-- header -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px">
    <div style="width:36px;height:36px;border-radius:50%;border:1px solid var(--sc-line);display:grid;place-items:center;color:var(--sc-muted);font-size:18px"><i data-lucide="chevron-left"></i></div>
    <span style="font-family:var(--font-heading);font-weight:600;font-size:17px;color:var(--sc-text)">Should I buy this?</span>
    <div style="width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--sc-faint);font-size:18px"><i data-lucide="x"></i></div>
  </div>

  <div style="flex:1;overflow:hidden;padding:8px 18px 0;display:flex;flex-direction:column">

    <!-- item + amount -->
    <div style="border:1px solid var(--sc-line);border-radius:14px;padding:12px 14px;background:var(--sc-surface)">
      <div style="display:flex;align-items:center;gap:8px;color:var(--sc-muted);font-size:13px;padding-bottom:8px;border-bottom:1px solid var(--sc-line)">
        <span style="font-size:15px;color:var(--sc-faint)"><i data-lucide="tag"></i></span>
        <span style="color:var(--sc-text)">Wireless earbuds</span>
        <span style="margin-left:auto;font-size:14px;color:var(--sc-faint)"><i data-lucide="pencil"></i></span>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:2px;padding:10px 0 2px">
        <span style="font-family:var(--font-heading);font-size:26px;color:var(--sc-muted)">₹</span>
        <span style="font-family:var(--font-heading);font-weight:600;font-size:46px;line-height:1;color:var(--sc-text);font-feature-settings:'tnum'">2,499</span>
        <span style="width:2px;height:38px;background:var(--sc-amber);margin-left:3px;animation:scblink 1.1s steps(1) infinite"></span>
      </div>
    </div>

    <!-- chips -->
    <div style="margin:16px 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sc-muted)">Category</div>
    <div class="sc-scroll" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -18px;padding-left:18px;padding-right:18px">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="6">
        <span style="flex:none;padding:8px 14px;border-radius:20px;font-size:13px;white-space:nowrap;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }}">{{ c.name }}</span>
      </sc-for>
    </div>

    <!-- verdict -->
    <div style="margin-top:16px;border:1px solid var(--sc-red);border-radius:16px;padding:15px 16px;background:rgba(215,111,94,.07);animation:scpop .35s ease both">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="width:26px;height:26px;border-radius:50%;background:rgba(215,111,94,.16);color:var(--sc-red);display:grid;place-items:center;font-size:15px"><i data-lucide="alert-triangle"></i></span>
        <span style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sc-red)">Over plan</span>
        <span style="margin-left:auto;padding:3px 9px;border-radius:6px;background:rgba(227,164,88,.15);color:var(--sc-amber);font-size:11px">Personal · Want</span>
      </div>
      <div style="font-family:var(--font-heading);font-weight:600;font-size:19px;color:var(--sc-text);margin:11px 0 3px;line-height:1.2">Only ₹800 left in Personal</div>
      <div style="font-size:13px;color:var(--sc-muted);line-height:1.5">This buy puts you <span style="color:var(--sc-red)">₹1,699 over</span> your ₹5,000 monthly plan.</div>
      <div style="height:8px;border-radius:6px;background:var(--sc-surface2);overflow:hidden;margin-top:12px;display:flex">
        <div style="height:100%;width:84%;background:var(--sc-amber)"></div>
        <div style="height:100%;width:16%;background:var(--sc-red)"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--sc-muted);font-feature-settings:'tnum'"><span>₹4,200 spent</span><span style="color:var(--sc-red)">+₹1,699 over</span></div>
    </div>

    <!-- decisions -->
    <div style="display:flex;gap:9px;margin-top:auto;padding:14px 0">
      <button style="flex:1;height:56px;border-radius:14px;background:transparent;border:1.5px solid var(--sc-green);color:var(--sc-green);font-family:var(--font-heading);font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer"><span style="font-size:18px"><i data-lucide="check"></i></span>Bought</button>
      <button style="flex:1;height:56px;border-radius:14px;background:transparent;border:1.5px solid var(--sc-red);color:var(--sc-red);font-family:var(--font-heading);font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer"><span style="font-size:18px"><i data-lucide="x"></i></span>Skipped</button>
      <button style="flex:1;height:56px;border-radius:14px;background:transparent;border:1.5px solid var(--sc-amber);color:var(--sc-amber);font-family:var(--font-heading);font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer"><span style="font-size:18px"><i data-lucide="clock"></i></span>Delayed</button>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const on = {border:'var(--sc-amber)', bg:'rgba(227,164,88,.16)', fg:'var(--sc-amber)'};
    const off = {border:'var(--sc-line)', bg:'transparent', fg:'var(--sc-muted)'};
    const names = ['Personal','Food Wants','Party/Contro','Clothes','Trip/Travel','CC Bills','Other'];
    const chips = names.map((name,i) => ({ name, ...(i===0?on:off) }));
    return { chips };
  }
}
</script>
</body>
</html>
