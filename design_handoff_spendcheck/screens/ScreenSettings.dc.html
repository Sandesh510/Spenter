<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:312px;height:712px;background:var(--sc-bg);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;font-family:var(--font-body)">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 22px 5px;font-size:12px;color:var(--sc-text);font-feature-settings:'tnum'">
    <span style="font-weight:600">9:41</span>
    <span style="display:flex;gap:6px;align-items:center;color:var(--sc-muted)"><span style="font-size:13px"><i data-lucide="signal"></i></span><span style="font-size:13px"><i data-lucide="wifi"></i></span><span style="font-size:14px"><i data-lucide="battery-full"></i></span></span>
  </div>

  <div class="sc-scroll" style="flex:1;overflow-y:auto;padding:8px 18px 92px">

    <span style="font-family:var(--font-heading);font-weight:600;font-size:24px;color:var(--sc-text)">Settings</span>

    <!-- categories -->
    <div style="margin:22px 2px 10px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sc-muted)">Budgets &amp; categories</span>
      <span style="font-size:11px;color:var(--sc-amber)">Edit</span>
    </div>
    <div style="border:1px solid var(--sc-line);border-radius:14px;background:var(--sc-surface);overflow:hidden">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
        <div style="display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--sc-line)">
          <span style="width:9px;height:9px;border-radius:3px;flex:none;background:{{ c.dot }}"></span>
          <span style="flex:1;font-size:13.5px;color:var(--sc-text)">{{ c.name }}</span>
          <span style="font-size:10px;color:var(--sc-faint);text-transform:uppercase;letter-spacing:.06em">{{ c.group }}</span>
          <span style="font-size:13px;color:var(--sc-text);font-feature-settings:'tnum';min-width:52px;text-align:right">{{ c.amt }}</span>
        </div>
      </sc-for>
      <div style="display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;color:var(--sc-amber);font-size:12.5px"><span style="font-size:15px"><i data-lucide="chevron-down"></i></span>Show all 14 categories</div>
    </div>

    <!-- accounts -->
    <div style="margin:24px 2px 10px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sc-muted)">Accounts</span>
      <span style="font-size:11px;color:var(--sc-amber);display:flex;align-items:center;gap:3px"><span style="font-size:13px"><i data-lucide="plus"></i></span>Add</span>
    </div>
    <div style="border:1px solid var(--sc-line);border-radius:14px;background:var(--sc-surface);overflow:hidden">
      <sc-for list="{{ accounts }}" as="a" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--sc-line)">
          <span style="width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--sc-surface2);color:var(--sc-muted);font-size:16px"><i data-lucide="{{ a.icon }}"></i></span>
          <span style="flex:1;font-size:13.5px;color:var(--sc-text)">{{ a.name }}</span>
          <span style="font-size:15px;color:var(--sc-faint)"><i data-lucide="chevron-right"></i></span>
        </div>
      </sc-for>
    </div>

    <!-- security -->
    <div style="margin:24px 2px 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sc-muted)">Security</div>
    <div style="border:1px solid var(--sc-line);border-radius:14px;background:var(--sc-surface);overflow:hidden">
      <div style="display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--sc-line)">
        <span style="font-size:17px;color:var(--sc-muted)"><i data-lucide="lock"></i></span>
        <span style="flex:1;font-size:13.5px;color:var(--sc-text)">App passcode</span>
        <span style="font-size:12px;color:var(--sc-faint);font-feature-settings:'tnum'">On</span>
        <span style="font-size:15px;color:var(--sc-faint)"><i data-lucide="chevron-right"></i></span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:13px 14px">
        <span style="font-size:17px;color:var(--sc-muted)"><i data-lucide="fingerprint"></i></span>
        <span style="flex:1;font-size:13.5px;color:var(--sc-text)">Biometric unlock</span>
        <span style="width:42px;height:24px;border-radius:14px;background:var(--sc-amber);position:relative;flex:none"><span style="position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#231a0c"></span></span>
      </div>
    </div>

    <!-- appearance -->
    <div style="margin:24px 2px 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sc-muted)">Appearance</div>
    <div style="border:1px solid var(--sc-line);border-radius:14px;background:var(--sc-surface);overflow:hidden">
      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--sc-line)">
        <span style="font-size:17px;color:var(--sc-muted)"><i data-lucide="moon"></i></span>
        <span style="flex:1;font-size:13.5px;color:var(--sc-text)">Theme</span>
        <span style="display:inline-flex;border:1px solid var(--sc-line);border-radius:9px;overflow:hidden">
          <span style="padding:5px 11px;font-size:12px;background:var(--sc-amber);color:#231a0c">Dark</span>
          <span style="padding:5px 11px;font-size:12px;color:var(--sc-muted)">Light</span>
        </span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:13px 14px">
        <span style="font-size:17px;color:var(--sc-muted)"><i data-lucide="indian-rupee"></i></span>
        <span style="flex:1;font-size:13.5px;color:var(--sc-text)">Currency</span>
        <span style="font-size:13px;color:var(--sc-muted)">₹ INR</span>
      </div>
    </div>

  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:76px;background:linear-gradient(to top,var(--sc-bg) 62%,transparent);border-top:1px solid var(--sc-line);display:flex;align-items:flex-start;justify-content:space-around;padding:9px 12px 0">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sc-faint);width:52px"><span style="font-size:21px"><i data-lucide="home"></i></span><span style="font-size:10px">Home</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sc-faint);width:52px"><span style="font-size:21px"><i data-lucide="receipt-text"></i></span><span style="font-size:10px">Log</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:56px;margin-top:-20px">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--sc-amber);display:grid;place-items:center;color:#231a0c;font-size:25px;box-shadow:0 10px 22px -6px color-mix(in srgb,var(--sc-amber) 70%,transparent)"><i data-lucide="help-circle"></i></div>
      <span style="font-size:10px;color:var(--sc-amber)">Ask</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sc-faint);width:52px"><span style="font-size:21px"><i data-lucide="bar-chart-3"></i></span><span style="font-size:10px">Trends</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sc-amber);width:52px"><span style="font-size:21px"><i data-lucide="settings"></i></span><span style="font-size:10px">Settings</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const need='var(--sc-need)', want='var(--sc-amber)', save='var(--sc-green)';
    const cats = [
      {name:'Food Needs', group:'Need', amt:'₹12,000', dot:need},
      {name:'EMI', group:'Need', amt:'₹11,000', dot:need},
      {name:'Personal', group:'Want', amt:'₹5,000', dot:want},
      {name:'Food Wants', group:'Want', amt:'₹3,000', dot:want},
      {name:'Investment', group:'Save', amt:'₹20,000', dot:save},
    ];
    const accounts = [
      {name:'HDFC Debit', icon:'wallet'},
      {name:'ICICI Credit Card', icon:'credit-card'},
      {name:'Cash', icon:'banknote'},
      {name:'Paytm Wallet', icon:'smartphone'},
    ];
    return { cats, accounts };
  }
}
</script>
</body>
</html>
